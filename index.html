<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Flappy Bird</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--sky:#4fc3e0;--ink:#1e2a3a;--yellow:#ffd23f;--white:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0f1a2b;font-family:Fredoka,"Segoe UI",Arial,sans-serif;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;width:min(100vw,calc(100vh * 0.6));height:min(100vh,calc(100vw / 0.6));box-shadow:0 0 80px rgba(0,0,0,.6);overflow:hidden;background:var(--sky)}
  canvas{display:block;width:100%;height:100%;cursor:pointer}
  .ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;pointer-events:none}
  .ui.hidden{display:none}
  .ui>*{pointer-events:auto}
  .logo{font-weight:700;font-size:clamp(40px,11vmin,64px);color:var(--yellow);letter-spacing:1px;line-height:1;text-shadow:0 4px 0 #b8860b,0 8px 0 rgba(0,0,0,.25);animation:bob 2s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px)}}
  .panel{background:#f5e6b8;border:4px solid #4a3a1a;border-radius:14px;padding:16px 22px;box-shadow:0 6px 0 #4a3a1a,0 14px 24px rgba(0,0,0,.3);min-width:220px;color:#4a3a1a;font-weight:600}
  .panel .row{display:flex;justify-content:space-between;gap:20px;font-size:16px;letter-spacing:1px;text-transform:uppercase;color:#8a6a2a}
  .panel .big{font-size:38px;color:#4a3a1a;line-height:1.1}
  .panel .medal{margin:10px auto 4px;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:30px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 3px 0 rgba(0,0,0,.25)}
  .btn{font:inherit;font-weight:700;font-size:20px;letter-spacing:1px;text-transform:uppercase;background:var(--yellow);color:#4a3a1a;border:4px solid #4a3a1a;border-radius:12px;padding:12px 30px;cursor:pointer;box-shadow:0 6px 0 #4a3a1a;transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translateY(5px);box-shadow:0 1px 0 #4a3a1a}
  .btn.sec{background:#fff;font-size:15px;padding:9px 18px}
  .hint{color:#fff;font-weight:600;font-size:15px;text-shadow:0 2px 0 rgba(0,0,0,.35);opacity:.95}
  .hint kbd{display:inline-block;background:rgba(255,255,255,.9);color:#1e2a3a;border-radius:6px;padding:1px 8px;margin:0 3px;font:inherit;font-size:13px}
  #score{position:absolute;top:6%;left:0;right:0;text-align:center;font-weight:700;font-size:clamp(44px,13vmin,80px);color:#fff;text-shadow:0 4px 0 #1e2a3a,0 0 0 #000;pointer-events:none}
  #score.hidden{display:none}
  #tap{position:absolute;inset:0;display:none;place-items:center;pointer-events:none}
  #tap span{font-weight:700;font-size:20px;color:#fff;text-shadow:0 3px 0 #1e2a3a;animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.08);opacity:.7}}
  #pause{position:absolute;top:12px;left:12px;width:40px;height:40px;border-radius:10px;border:3px solid #4a3a1a;background:rgba(255,255,255,.85);cursor:pointer;display:none;place-items:center;box-shadow:0 3px 0 #4a3a1a}
  #pause svg{width:16px;height:16px;fill:#4a3a1a}
  #mute{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:10px;border:3px solid #4a3a1a;background:rgba(255,255,255,.85);cursor:pointer;display:grid;place-items:center;font-size:18px;box-shadow:0 3px 0 #4a3a1a}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  .flash.on{animation:flash .25s ease-out}
  @keyframes flash{from{opacity:.9}to{opacity:0}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="score" class="hidden">0</div>
  <div id="tap"><span>TAP TO FLAP</span></div>
  <div class="flash" id="flash"></div>
  <button id="pause" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
  <button id="mute" aria-label="Mute">🔊</button>

  <div class="ui" id="menu">
    <div class="logo">Flappy Bird</div>
    <div class="panel"><div class="row"><span>Best</span><span id="mBest">0</span></div></div>
    <button class="btn" id="startBtn">▶ Play</button>
    <div class="hint"><kbd>Space</kbd> or <kbd>Tap</kbd> to flap · <kbd>P</kbd> pause</div>
  </div>

  <div class="ui hidden" id="over">
    <div class="logo" style="font-size:clamp(30px,8vmin,46px)">Game Over</div>
    <div class="panel">
      <div class="medal" id="medal"></div>
      <div class="row"><span>Score</span><span id="oScore" class="big">0</span></div>
      <div class="row"><span>Best</span><span id="oBest">0</span></div>
      <div id="newBest" style="color:#d6336c;font-size:14px;margin-top:6px;display:none">★ NEW BEST ★</div>
    </div>
    <button class="btn" id="againBtn">↻ Play again</button>
    <button class="btn sec" id="menuBtn">Menu</button>
  </div>

  <div class="ui hidden" id="paused">
    <div class="logo" style="font-size:40px">Paused</div>
    <button class="btn" id="resumeBtn">▶ Resume</button>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const W=360,H=600,GROUND=H-80;
let DPR=1;
function fit(){DPR=Math.min(2,devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

/* ---- audio ---- */
let AC=null,muted=localStorage.getItem('flappy-muted')==='1';
$('mute').textContent=muted?'🔇':'🔊';
function beep(f,d,type,v,slide){if(muted)return;try{AC=AC||new(AudioContext||webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}
const sfx={flap:()=>beep(520,.08,'triangle',.07,300),score:()=>{beep(880,.08,'square',.05);setTimeout(()=>beep(1320,.12,'square',.05),70)},hit:()=>beep(160,.3,'sawtooth',.12,-100),die:()=>beep(400,.5,'sawtooth',.08,-300)};
$('mute').onclick=()=>{muted=!muted;localStorage.setItem('flappy-muted',muted?'1':'0');$('mute').textContent=muted?'🔇':'🔊';$('mute').blur();};

/* ---- state ---- */
const G=1500,FLAP=-430,SPEED=150,GAP=165,PW=64,SPAWN=1.55;
let state='menu',bird,pipes,score,best=+localStorage.getItem('flappy-best')||0,t=0,spawnT=0,gx=0,cx=0,shake=0,dead=0,last=performance.now();
const clouds=Array.from({length:6},(_,i)=>({x:i*90+Math.random()*60,y:40+Math.random()*180,s:.6+Math.random()*.8,v:8+Math.random()*10}));
const skyline=Array.from({length:14},(_,i)=>({x:i*34,w:26+Math.random()*14,h:40+Math.random()*90}));
$('mBest').textContent=best;
function reset(){bird={x:W*.3,y:H*.45,vy:0,rot:0,wing:0};pipes=[];score=0;spawnT=.9;gx=0;shake=0;dead=0;$('score').textContent='0';}
function show(id){for(const s of['menu','over','paused'])$(s).classList.toggle('hidden',s!==id);}
function start(){reset();state='play';show(null);$('score').classList.remove('hidden');$('tap').style.display='grid';setTimeout(()=>$('tap').style.display='none',1200);$('pause').style.display='grid';bird.vy=FLAP;sfx.flap();}
function gameOver(){state='dead';dead=0;shake=.5;sfx.hit();setTimeout(()=>sfx.die(),120);$('flash').classList.remove('on');void $('flash').offsetWidth;$('flash').classList.add('on');$('pause').style.display='none';
  const isBest=score>best;if(isBest){best=score;localStorage.setItem('flappy-best',best);}
  setTimeout(()=>{$('score').classList.add('hidden');$('oScore').textContent=score;$('oBest').textContent=best;$('mBest').textContent=best;$('newBest').style.display=isBest&&score>0?'block':'none';
    const m=$('medal');const tier=score>=40?['#7ad7ff','💎']:score>=25?['#ffd23f','🥇']:score>=10?['#d9d9d9','🥈']:score>=3?['#d99a5b','🥉']:[null,'🐣'];m.style.background=tier[0]||'#eee';m.textContent=tier[1];show('over');},900);}
function pause(){if(state!=='play')return;state='paused';show('paused');}
function resume(){if(state!=='paused')return;state='play';show(null);last=performance.now();}
function flap(){if(state==='play'){bird.vy=FLAP;bird.wing=1;sfx.flap();}else if(state==='menu')start();}

/* ---- input ---- */
cv.addEventListener('pointerdown',e=>{e.preventDefault();flap();});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(state==='over')return;flap();}
  if(e.code==='KeyP'||e.code==='Escape'){state==='play'?pause():resume();}
  if(e.code==='Enter'&&state==='dead'){/* wait */}});
$('startBtn').onclick=start;$('againBtn').onclick=start;$('menuBtn').onclick=()=>{state='menu';show('menu');reset();};
$('pause').onclick=pause;$('resumeBtn').onclick=resume;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});

/* ---- update ---- */
function update(dt){
  t+=dt;gx=(gx+SPEED*dt)%48;cx+=dt;
  for(const c of clouds){c.x-=c.v*dt;if(c.x<-80)c.x=W+40;}
  if(state!=='play'&&state!=='dead')return;
  bird.vy+=G*dt;bird.y+=bird.vy*dt;bird.rot=Math.max(-.45,Math.min(1.3,bird.vy/480));bird.wing=Math.max(0,bird.wing-dt*4);
  if(state==='dead'){if(bird.y>GROUND-20){bird.y=GROUND-20;bird.vy=0;}shake=Math.max(0,shake-dt);return;}
  spawnT-=dt;if(spawnT<=0){spawnT=SPAWN;const m=70;pipes.push({x:W+PW,c:m+GAP/2+Math.random()*(GROUND-m*2-GAP),passed:false});}
  for(let i=pipes.length-1;i>=0;i--){const p=pipes[i];p.x-=SPEED*dt;
    if(!p.passed&&p.x+PW<bird.x){p.passed=true;score++;$('score').textContent=score;sfx.score();}
    if(p.x<-PW-10)pipes.splice(i,1);}
  const r=14;
  if(bird.y+r>=GROUND||bird.y-r<=0){bird.y=Math.min(bird.y,GROUND-r);gameOver();return;}
  for(const p of pipes){if(bird.x+r>p.x+4&&bird.x-r<p.x+PW-4){if(bird.y-r<p.c-GAP/2||bird.y+r>p.c+GAP/2){gameOver();return;}}}
}

/* ---- draw ---- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function draw(){
  ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake*16,(Math.random()-.5)*shake*16);
  const sky=ctx.createLinearGradient(0,0,0,GROUND);sky.addColorStop(0,'#3fb4dc');sky.addColorStop(1,'#bfeefb');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // sun
  ctx.fillStyle='rgba(255,240,170,.9)';ctx.beginPath();ctx.arc(W-70,80,34,0,7);ctx.fill();
  // clouds
  for(const c of clouds){ctx.fillStyle='rgba(255,255,255,.9)';for(const[dx,dy,r]of[[0,0,22],[20,6,16],[-20,8,15],[8,-8,14]]){ctx.beginPath();ctx.arc(c.x+dx*c.s,c.y+dy*c.s,r*c.s,0,7);ctx.fill();}}
  // skyline
  const sx=(cx*18)%(skyline.length*34);
  ctx.fillStyle='#8fd6e6';for(const b of skyline){let x=b.x-sx;if(x<-40)x+=skyline.length*34;ctx.fillRect(x,GROUND-b.h,b.w,b.h);ctx.fillStyle='#a9e2ee';for(let wy=GROUND-b.h+8;wy<GROUND-10;wy+=14)for(let wx=x+5;wx<x+b.w-6;wx+=9)ctx.fillRect(wx,wy,4,6);ctx.fillStyle='#8fd6e6';}
  // bushes
  const bx=(cx*40)%60;ctx.fillStyle='#6cc16c';for(let x=-bx-30;x<W+30;x+=60){ctx.beginPath();ctx.arc(x,GROUND+2,26,Math.PI,0);ctx.arc(x+30,GROUND+2,18,Math.PI,0);ctx.fill();}
  // pipes
  for(const p of pipes){for(const top of[1,0]){const y0=top?0:p.c+GAP/2,y1=top?p.c-GAP/2:GROUND;const g=ctx.createLinearGradient(p.x,0,p.x+PW,0);g.addColorStop(0,'#5ec25e');g.addColorStop(.3,'#8de68d');g.addColorStop(.7,'#5ec25e');g.addColorStop(1,'#2f7f2f');
    ctx.fillStyle=g;ctx.fillRect(p.x+3,y0,PW-6,y1-y0);const cy=top?y1-30:y0;rr(p.x,cy,PW,30,5);ctx.fill();ctx.strokeStyle='#1f5a1f';ctx.lineWidth=2.5;ctx.strokeRect(p.x+3,y0-(top?3:0),PW-6,y1-y0+3);rr(p.x,cy,PW,30,5);ctx.stroke();}}
  // ground
  ctx.fillStyle='#d9c87a';ctx.fillRect(0,GROUND,W,H-GROUND);ctx.fillStyle='#8fd05e';ctx.fillRect(0,GROUND,W,14);ctx.fillStyle='#6cb43a';for(let x=-gx;x<W;x+=48)ctx.fillRect(x,GROUND,24,14);ctx.fillStyle='#c4b060';for(let x=-gx*.7%40;x<W;x+=40)ctx.fillRect(x,GROUND+40,18,6);
  // bird
  ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(state==='menu'?Math.sin(t*3)*.08:bird.rot);
  ctx.fillStyle='rgba(0,0,0,.12)';ctx.beginPath();ctx.ellipse(2,4,18,14,0,0,7);ctx.fill();
  ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.ellipse(0,0,18,14,0,0,7);ctx.fill();ctx.strokeStyle='#b8860b';ctx.lineWidth=2.5;ctx.stroke();
  ctx.fillStyle='#ffe88a';ctx.beginPath();ctx.ellipse(-3,5,10,6,0,0,7);ctx.fill();
  const wa=(state==='play'||state==='menu')?Math.sin((state==='menu'?t*8:t*22))*.6-bird.wing*.8:.6;
  ctx.save();ctx.translate(-4,0);ctx.rotate(wa);ctx.fillStyle='#f0a500';ctx.beginPath();ctx.ellipse(-6,2,11,6,.2,0,7);ctx.fill();ctx.strokeStyle='#b8860b';ctx.lineWidth=2;ctx.stroke();ctx.restore();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(8,-5,6,0,7);ctx.fill();ctx.strokeStyle='#b8860b';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='#1e2a3a';ctx.beginPath();ctx.arc(10,-5,2.6,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(11,-6,.9,0,7);ctx.fill();
  ctx.fillStyle='#ff7a1a';ctx.beginPath();ctx.moveTo(15,-1);ctx.lineTo(28,2);ctx.lineTo(15,6);ctx.closePath();ctx.fill();ctx.strokeStyle='#c45a0a';ctx.lineWidth=1.5;ctx.stroke();ctx.beginPath();ctx.moveTo(15,2.5);ctx.lineTo(26,2.5);ctx.stroke();
  ctx.restore();
  ctx.restore();
}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.033,(now-last)/1000);last=now;if(state!=='paused')update(dt);draw();}
if(!ctx.roundRect)ctx.roundRect=function(x,y,w,h,r){this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();};
reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
